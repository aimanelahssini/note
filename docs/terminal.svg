<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">
  <rect width="760" height="330" rx="16" fill="#1e1e1e"/>
  <rect width="760" height="40" rx="16" fill="#2d2d2d"/><rect y="24" width="760" height="16" fill="#2d2d2d"/>
  <circle cx="24" cy="20" r="7" fill="#ff5f57"/><circle cx="46" cy="20" r="7" fill="#febc2e"/><circle cx="68" cy="20" r="7" fill="#28c840"/>
  <text x="380" y="26" fill="#9a9a9a" font-size="14" text-anchor="middle" font-family="Cantarell, 'Inter', sans-serif">Terminal</text>
  <g font-size="17">
    <text x="28" y="80"><tspan fill="#7fd27f">$</tspan><tspan x="49" fill="#ffd76a" font-weight="bold">note</tspan><tspan x="100" fill="#e6e6e6">call the dentist at 9, don't forget</tspan></text>
    <text x="28" y="108" fill="#9a9a9a">noted</text>
    <text x="28" y="148"><tspan fill="#7fd27f">$</tspan><tspan x="49" fill="#ffd76a" font-weight="bold">note</tspan><tspan x="100" fill="#e6e6e6">Review this PR: check the * edge cases;</tspan></text>
    <text x="100" y="174" fill="#e6e6e6">then summarize the risks in 3 bullets</text>
    <text x="28" y="202" fill="#9a9a9a">noted</text>
    <text x="28" y="242"><tspan fill="#7fd27f">$</tspan><tspan x="49" fill="#ffd76a" font-weight="bold">note</tspan></text>
    <text x="28" y="270" fill="#9a9a9a">copied: Review this PR: check the * edge cases;</text>
    <text x="110" y="296" fill="#9a9a9a">then summarize the risks in 3 bullets</text>
  </g>
  <g font-family="Cantarell, 'Inter', sans-serif" font-size="13" fill="#d97757">
    <text x="600" y="108">replaces old note</text>
    <text x="600" y="202">pasted, multi-line</text>
    <text x="600" y="270">on your clipboard</text>
  </g>
